name: medicine_tracker
description: "Medicine Tracker, Reminder & Log"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management (MVVM: ChangeNotifier view-models exposed with Provider)
  provider: ^6.1.2

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6

  # Reminders
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.0
  flutter_timezone: ^4.1.1

  # Formatting
  intl: ^0.20.2
  image_picker: ^1.2.3
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - img/DailyDoseLogo.png

flutter_launcher_icons:
  android: true
  ios: true
  min_sdk_android: 23
  image_path: "img/DailyDoseLogo.png"
  adaptive_icon_background: "#8ED2E8"
  adaptive_icon_foreground: "img/DailyDoseLogo.png"
  web:
    generate: true
    image_path: "img/DailyDoseLogo.png"
    background_color: "#8ED2E8"
    theme_color: "#0D2647"